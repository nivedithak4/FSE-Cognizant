<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model & Layout Control</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Event Cards</h1>

    <div class="eventCard">
        <h2>Tech Fest</h2>
        <p>Explore innovative technologies and projects.</p>
    </div>

    <div class="eventCard selected">
        <h2>Music Night</h2>
        <p>Enjoy live performances by talented artists.</p>
    </div>

    <h2>Visibility Example</h2>

    <div class="hiddenBox">
        This box uses visibility: hidden
    </div>

    <div class="noneBox">
        This box uses display: none
    </div>

    <p>
        This text appears after the hidden and display-none elements.
    </p>

</body>
</html>
